{{ if .Params.toc }}
<details
  open
  id="TOCView"
  class="toc-right mt-0 overflow-y-auto overscroll-contain bf-scrollbar rounded-lg -ms-5 pe-2 hidden lg:block">
  <summary
    class="block py-1 text-lg font-semibold cursor-pointer bg-neutral-100 text-neutral-800 -ms-5 dark:bg-neutral-700 dark:text-neutral-100 lg:hidden">
    {{ i18n "article.table_of_contents" }}
  </summary>
  <div
    class="min-w-[220px] py-2 border-dotted border-s-1 ps-5 dark:border-neutral-600">
    <ul class="text-left">
    {{ range .Params.toc }}
      <li {{ if eq .level 3 }}style="margin-left: 1rem;"{{ end }}><a href="#{{ .anchor }}" {{ if .tab }}data-tab="{{ .tab }}"{{ end }}>{{ .title }}</a></li>
    {{ end }}
    </ul>
  </div>
</details>
<details class="toc-inside mt-0 overflow-hidden rounded-lg -ms-5 ps-5 lg:hidden">
  <summary
    class="py-1 text-lg font-semibold cursor-pointer bg-neutral-100 text-neutral-800 -ms-5 ps-5 dark:bg-neutral-700 dark:text-neutral-100 lg:hidden">
    {{ i18n "article.table_of_contents" }}
  </summary>
  <div
    class="py-2 border-dotted border-neutral-300 border-s-1 -ms-5 ps-5 dark:border-neutral-600">
    <ul class="text-left">
    {{ range .Params.toc }}
      <li {{ if eq .level 3 }}style="margin-left: 1rem;"{{ end }}><a href="#{{ .anchor }}" {{ if .tab }}data-tab="{{ .tab }}"{{ end }}>{{ .title }}</a></li>
    {{ end }}
    </ul>
  </div>
</details>
<script>
(function() {
  const tocLinks = document.querySelectorAll('.toc a[data-tab]');
  tocLinks.forEach(link => {
    link.addEventListener('click', function(e) {
      const tabName = this.getAttribute('data-tab');
      const tabContainer = document.querySelector('[data-default-tab]');
      if (tabContainer) {
        const buttons = tabContainer.querySelectorAll('[role="tab"]');
        buttons.forEach(btn => {
          if (btn.textContent.trim() === tabName) {
            btn.click();
          }
        });
      }
    });
  });
})();
</script>
{{ else }}
  {{ partial "toc.html" . }}
{{ end }}
